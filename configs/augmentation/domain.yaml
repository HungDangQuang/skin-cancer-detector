# Domain-targeted augmentation — the `augmentation=domain` ablation arm.
# Designed 2026-09-21 (docs/domain_aug_plan.md) to answer: the model collapses
# across image domains — does attacking the DIAGNOSED cause at TRAIN time
# recover any of it?
#
# It is NOT "heavy, but more". `heavy` raises probabilities and photometric
# range but leaves ShiftScaleRotate.scale_limit at 0.2 — the SAME value as
# `light` — so the field-of-view axis has never been touched by either preset.
# This preset moves exactly two axes, both diagnosed:
#   1. FIELD OF VIEW / framing  — the crop70 experiment (docs/PREPROCESSING.md
#      §1.2) is positive on 19/19 runs, significant on 18/19 (AUC-ROC), and
#      recovers ~6 % of the cross-domain gap. But it fixes framing at INFERENCE
#      time only. scale_limit 0.2 -> 0.5 is the train-time counterpart: scale<1
#      shrinks the lesion inside the frame = "photographed from further away".
#   2. LIGHTING / WHITE BALANCE — ColorJitter + CLAHE + RandomGamma, for the
#      capture-device variation between dermoscopy and clinical cameras.
#
# Deliberately NOT here:
#   - RandomResizedCrop: build_transforms always PREPENDS Resize(image_size), so
#     a crop op would cut into the already-squashed 224 square and discard the
#     detail it is meant to zoom into (docs/PREPROCESSING.md §1.2). The
#     field-of-view axis goes through ShiftScaleRotate.scale_limit instead.
#   - A dermatoscope-style vignette: the only data carrying a vignette is
#     HAM10000, which is a cross-domain TEST set. Training it in would mix
#     generalization with leakage (docs/PREPROCESSING.md §4 "Drop or de-risk").
#   - MixUp / CutMix / CoarseDropout: _FORBIDDEN_OPS raises on them, by design.
#
# Expected ceiling is LOW (framing was only ~6 % of the gap). A null result is
# still a result: it moves the conclusion to "this needs more data, not more
# technique". Compare paired against the `light` arm — never unpaired.
train:
  - name: HorizontalFlip
    p: 0.5
  - name: VerticalFlip
    p: 0.5
  - name: RandomRotate90
    p: 0.5
  # THE axis of this arm. scale_limit is symmetric about 1.0, so 0.5 spans
  # [0.5x, 1.5x] — half the draws zoom out (the wide clinical framing), half
  # zoom in. shift_limit 0.3 breaks the "lesion is exactly centred" prior that
  # ISIC's crops teach and that a phone photo will not honour.
  - name: ShiftScaleRotate
    shift_limit: 0.3
    scale_limit: 0.5
    rotate_limit: 180
    p: 0.9
  # Capture-device colour: white balance + illumination differ between a
  # contact dermatoscope and a handheld camera.
  - name: ColorJitter
    brightness: 0.4
    contrast: 0.4
    saturation: 0.4
    hue: 0.2
    p: 0.8
  - name: CLAHE
    clip_limit: 4.0
    p: 0.5
  # Exposure error (clinical photos are not exposure-controlled).
  - name: RandomGamma
    gamma_limit: [80, 120]
    p: 0.3
  - name: GaussianBlur
    blur_limit: [3, 7]
    p: 0.3
  - name: GaussNoise
    var_limit: [10.0, 50.0]
    p: 0.3
  - name: Normalize
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

# UNCHANGED from light/heavy, on purpose: the evaluation path must stay
# byte-for-byte identical or the arm is no longer comparable to the existing
# 140 fold-run matrix.
val:
  - name: Normalize
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
