# Moderate augmentation for benign class
train:
  - name: HorizontalFlip
    p: 0.5
  - name: VerticalFlip
    p: 0.5
  - name: Rotate
    limit: 360
    p: 0.7
  - name: RandomScale
    scale_limit: 0.2
    p: 0.5
  - name: ColorJitter
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.1
    p: 0.8
  - name: CLAHE
    clip_limit: 2.0
    p: 0.3
  - name: Normalize
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

val:
  - name: Normalize
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
