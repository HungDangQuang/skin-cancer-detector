train:
  - name: RandomHorizontalFlip
    p: 0.5
  - name: RandomVerticalFlip
    p: 0.5
  - name: RandomRotation
    limit: 90
    p: 0.5
  - name: ColorJitter
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.1
    p: 0.5
  - name: Normalize
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

val:
  - name: Normalize
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
