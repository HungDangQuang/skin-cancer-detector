# Light augmentation (DEFAULT) — reproduces the pipeline that was previously
# hard-coded in src/data/transforms.py, so `augmentation=light` keeps the exact
# behavior of the original 30-run experiment. Class-symmetric, per-image only.
# Built by build_transforms (Resize is prepended, ToTensorV2 appended).
train:
  - name: HorizontalFlip
    p: 0.5
  - name: VerticalFlip
    p: 0.5
  - name: RandomRotate90
    p: 0.5
  # Lesions have no canonical orientation → allow any angle (proposal §3.5).
  - name: ShiftScaleRotate
    shift_limit: 0.1
    scale_limit: 0.2
    rotate_limit: 180
    p: 0.5
  - name: ColorJitter
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.1
    p: 0.5
  # Low-p CLAHE: simulates smartphone lighting/contrast variance (uint8, pre-Normalize).
  - name: CLAHE
    clip_limit: 2.0
    p: 0.2
  - name: GaussianBlur
    blur_limit: [3, 7]
    p: 0.2
  - name: Normalize
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

val:
  - name: Normalize
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
