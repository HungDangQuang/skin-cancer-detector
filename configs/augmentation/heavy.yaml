# Heavy augmentation — a strictly stronger version of `light` for fighting
# overfitting at extreme class imbalance: higher probabilities + wider
# photometric range + GaussNoise. Anti-overfit lever; enable per-run with
# `augmentation=heavy` (requires retraining). Still class-symmetric, per-image.
#
# MixUp / CutMix / CoarseDropout (CutOut) are INTENTIONALLY ABSENT — they hurt
# the rare class and/or break KD soft targets (see docs/PREPROCESSING.md).
# build_transforms raises if any of them appear here, by design.
train:
  - name: HorizontalFlip
    p: 0.5
  - name: VerticalFlip
    p: 0.5
  - name: RandomRotate90
    p: 0.5
  - name: ShiftScaleRotate
    shift_limit: 0.1
    scale_limit: 0.2
    rotate_limit: 180
    p: 0.7
  - name: ColorJitter
    brightness: 0.3
    contrast: 0.3
    saturation: 0.3
    hue: 0.15
    p: 0.7
  - name: CLAHE
    clip_limit: 2.0
    p: 0.3
  - name: GaussianBlur
    blur_limit: [3, 7]
    p: 0.3
  - name: GaussNoise
    var_limit: [10.0, 50.0]
    p: 0.3
  - name: Normalize
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

val:
  - name: Normalize
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
