train:
  - name: RandomHorizontalFlip
    p: 0.5
  - name: RandomVerticalFlip
    p: 0.5
  - name: RandomRotation
    limit: 180
    p: 0.7
  - name: ShiftScaleRotate
    shift_limit: 0.1
    scale_limit: 0.2
    rotate_limit: 45
    p: 0.5
  - name: ColorJitter
    brightness: 0.3
    contrast: 0.3
    saturation: 0.3
    hue: 0.1
    p: 0.6
  - name: RandomGamma
    gamma_limit: [80, 120]
    p: 0.3
  - name: GaussianBlur
    blur_limit: [3, 7]
    p: 0.2
  - name: CoarseDropout
    max_holes: 8
    max_height: 20
    max_width: 20
    p: 0.3
  - name: Normalize
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

val:
  - name: Normalize
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
