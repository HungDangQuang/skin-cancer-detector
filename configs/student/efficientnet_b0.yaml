name: efficientnet_b0
role: student
paradigm: compound_scaling
backbone: efficientnet_b0
pretrained: true
num_classes: 1    # binary sigmoid output

head:
  dropout: 0.3

# Stochastic depth (anti-overfit regularizer). Default 0.0 = off (preserves the
# original 30-run behavior). Enable per-run, e.g. `student.drop_path_rate=0.1`.
# Verify the backbone accepts the kwarg on the cluster before a full run.
drop_path_rate: 0.0

freeze_backbone: false
