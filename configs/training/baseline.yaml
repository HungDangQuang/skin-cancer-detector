# Student baseline training config (NO knowledge distillation)
# Identical to distillation.yaml except no distillation block.
# Used as the controlled comparison branch.
use_kd: false       # plain Trainer + BinaryFocalLoss, no teacher
epochs: 50
batch_size: 64
grad_clip: 1.0

optimizer:
  name: adamw
  lr_backbone: 1.0e-4
  lr_head: 1.0e-3
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]

scheduler:
  name: cosine
  T_max: 50
  eta_min: 1.0e-6
  warmup_epochs: 3

loss:
  name: focal_loss
  gamma: 2.0
  alpha: 0.25

callbacks:
  early_stopping:
    enabled: true
    patience: 10
    monitor: val_loss
    mode: min
  checkpoint:
    enabled: true
    monitor: val_pauc_at_tpr80
    mode: max
    save_last: true
