# Teacher training config
epochs: 50
batch_size: 32
# Batch size for val/test only (0 = same as batch_size). Eval runs under
# no_grad, so a larger batch fits and cuts per-batch overhead; eval-mode
# BatchNorm uses running stats, so per-sample outputs are unchanged.
eval_batch_size: 0
grad_clip: 1.0

optimizer:
  name: adamw
  lr_backbone: 1.0e-4    # lower LR for pretrained backbone
  lr_head: 1.0e-3        # higher LR for new classification head
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]

scheduler:
  name: cosine
  T_max: 50
  eta_min: 1.0e-6
  warmup_epochs: 3

loss:
  name: focal_loss
  gamma: 2.0
  alpha: 0.25    # prior probability of malignant class

callbacks:
  early_stopping:
    enabled: true
    patience: 10
    monitor: val_loss
    mode: min
  checkpoint:
    enabled: true
    monitor: val_pauc_at_tpr80
    mode: max
    save_last: true
