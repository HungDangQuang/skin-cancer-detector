name: custom_cnn
pretrained: false
num_classes: 7

# Architecture definition
layers:
  - {out_channels: 32, kernel_size: 3, pool: true}
  - {out_channels: 64, kernel_size: 3, pool: true}
  - {out_channels: 128, kernel_size: 3, pool: true}
  - {out_channels: 256, kernel_size: 3, pool: true}

head:
  dropout: 0.5
  hidden_dim: 512
