# POC data config — uses synthetic fixtures generated by scripts/prepare_poc_data.py.
# Real data (ISIC 2024) is NOT required.
#
# Generate fixtures with: make prepare-poc
name: poc
role: proof_of_concept

raw_dir: data/raw/poc
processed_dir: data/processed/poc
splits_dir: data/splits/poc

image_size: 224
num_classes: 1           # binary sigmoid output

classes:
  - benign
  - malignant

label_col: label
image_id_col: image_id

# Only fold_0 is generated; no 5-fold CV for POC
split_strategy: random
num_folds: 1
group_col: patient_id
random_seed: 42

# Keep class-imbalance sampling enabled so the sampler code path runs
use_weighted_sampler: true
undersample_ratio: 3     # small ratio because we only have a handful of malignants
