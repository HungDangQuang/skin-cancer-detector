name: isic2019
raw_dir: data/external/isic2019
processed_dir: data/processed_isic
splits_dir: data/splits_isic

image_size: 224
num_classes: 8

classes:
  - MEL
  - NV
  - BCC
  - AK
  - BKL
  - DF
  - VASC
  - SCC

class_to_idx:
  MEL: 0
  NV: 1
  BCC: 2
  AK: 3
  BKL: 4
  DF: 5
  VASC: 6
  SCC: 7

split_ratios:
  train: 0.7
  val: 0.15
  test: 0.15

use_weighted_sampler: true
