# HAM10000 is used ONLY for cross-domain evaluation.
# NEVER used for training, validation during training, or threshold selection.
name: ham10000
role: cross_domain_evaluation

raw_dir: data/raw/ham10000
processed_dir: data/processed/ham10000
splits_dir: data/splits/ham10000

image_size: 224
image_type: dermoscopic    # different domain from training (non-dermoscopic ISIC 2024)

# Original 7-class labels mapped to binary for evaluation
label_mapping:
  mel: 1       # melanoma → malignant
  bcc: 1       # basal cell carcinoma → malignant
  akiec: 1     # actinic keratosis → malignant (borderline)
  nv: 0        # nevus → benign
  bkl: 0       # benign keratosis → benign
  df: 0        # dermatofibroma → benign
  vasc: 0      # vascular lesion → benign

label_col: label
image_id_col: image_id

use_only_for:
  - cross_domain_evaluation
do_not_use_for:
  - training
  - validation_during_training
  - threshold_selection
