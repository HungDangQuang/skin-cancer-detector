name: isic2024
role: primary_training

raw_dir: data/raw/isic2024
processed_dir: data/processed/isic2024
splits_dir: data/splits/isic2024

# Raw structure:
#   data/raw/isic2024/
#     train-image.hdf5     <- HDF5 file; keys=isic_id, values=JPEG bytes
#     train-metadata.csv   <- isic_id, patient_id, target (0/1), age_approx, sex, ...

image_size: 224
num_classes: 1           # binary sigmoid output

classes:
  - benign     # target = 0  (~99.1% of data)
  - malignant  # target = 1  (~0.9% of data)

label_col: target
image_id_col: isic_id

# Patient-level split — prevents leakage when one patient has multiple images
split_strategy: stratified_group_kfold
num_folds: 5
group_col: patient_id
random_seed: 42
# Independent held-out test set: 1/test_holdout_splits of the data (≈17% with 6),
# carved patient-disjoint + stratified BEFORE the CV folds, so every fold tests
# on the same data it never trained on. (Replaces the old test=fold0-val design.)
test_holdout_splits: 6

# Which fold to train on. Override via Hydra (e.g. data.fold=2) or from a
# Slurm array via `data.fold=${SLURM_ARRAY_TASK_ID}`. The full 5-fold sweep
# is run as a Slurm array; per-fold results land under run_dir/fold_${fold}/.
fold: 0

# Dynamic undersampling: 1 malignant : 5 benign per epoch (resampled each epoch)
use_weighted_sampler: true
undersample_ratio: 5

# PAD ablation knob. null = train on all sources (ISIC+PAD, the default strategy).
# Set to a list (e.g. [isic2024]) to restrict TRAIN+VAL to those source datasets;
# the held-out TEST set is unaffected so both arms share an identical test.
train_sources: null

# Metadata knob (default null = drop ALL metadata; 6-column schema, image-only
# runs byte-for-byte unchanged). Set to a list of raw ISIC metadata columns to
# carry them into the split CSVs, enabling:
#   - subgroup calibration (direction D): [anatom_site_general, sex]
#   - privileged teacher (direction A):   [tbp_lv_symm_2axis, tbp_lv_norm_border, ...]
# FORBIDDEN: iddx_*/mel_* (post-biopsy leakage — prepare_data raises).
# PAD-UFES-20 has no tbp_lv_* schema, so these columns are NaN for PAD rows.
# See docs/metadata_training_plan.md §0 (taxonomy) and §A/§D.
metadata_cols: null

# Gate for feeding metadata INTO the model as a batch tensor (direction A —
# privileged/LUPI teacher). Default false = the dataset returns (image, label)
# and metadata_cols only flow into the CSVs / predictions.csv side-channel
# (direction D, model stays image-only). Set true ONLY with a privileged teacher
# (teacher=<name>_privileged), which then receives (image, meta, mask). The
# scaler is fit on the train fold only. See docs/metadata_training_plan.md §A.
metadata_as_input: false
