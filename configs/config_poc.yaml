# POC (Proof-of-Concept) root config
# Smoke-tests the entire pipeline: teacher → KD student → evaluate.
# Uses 2 epochs, batch_size 16, no warmup, no early stopping.
#
# Prerequisites:
#   1. Data prepared: `make prepare` (produces data/splits/isic2024/fold_0/*.csv)
#   2. CPU or CUDA both work — no code changes needed.
#
# Run:
#   python scripts/train_teacher.py --config-name config_poc
#   python scripts/train_student.py --config-name config_poc student=efficientnet_b0
#   python scripts/train_student.py --config-name config_poc student=mobilenetv3_large
#   python scripts/train_student.py --config-name config_poc student=mobilevit_s
#
# Outputs go under: experiments/poc/...
defaults:
  - data: poc             # synthetic fixtures — generated by `make prepare-poc`
  - teacher: efficientnet_b4
  - student: efficientnet_b0
  - training: poc
  - augmentation: light
  - _self_

seed: 42
experiment_name: kd-skin-cancer-poc
output_dir: experiments/poc

device: cuda       # auto-falls-back to cpu if CUDA unavailable
num_workers: 2

# See configs/config.yaml — set false for maxvit_base (cuDNN backward error).
cudnn_deterministic: true
