defaults:
  - data: isic2024
  - teacher: efficientnet_b4
  - student: efficientnet_b0
  - training: distillation
  - augmentation: light
  - _self_

seed: 42
experiment_name: kd-skin-cancer
output_dir: experiments/runs
# Appended to the run-dir name (after the run-type, before /fold_N) so an
# ablation lands in its own subtree without overwriting the main 30 runs.
# e.g. run_suffix=__samp_off, run_suffix=__ratio3. Empty = main run.
run_suffix: ""

device: cuda  # cuda or cpu
num_workers: 4

# cuDNN determinism. true (default) = bit-exact reproducibility (the 30-run
# baseline behavior). Set false for heavy attention backbones (e.g. maxvit_base)
# whose deterministic backward raises CUDNN_STATUS_INTERNAL_ERROR — lets cuDNN
# pick a working algorithm. Override per-run: `cudnn_deterministic=false`.
cudnn_deterministic: true
