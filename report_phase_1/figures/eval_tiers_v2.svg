<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AA0A6"/>
    </marker>
    <filter id="cardShadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1a1a1a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1000" height="700" fill="#FFFFFF"/>

  <!-- ===== ONE MODEL (gray) ===== -->
  <rect x="40" y="40" width="920" height="84" rx="14" fill="#EEEDEA" stroke="#D8D6D1"/>
  <text x="500" y="74" text-anchor="middle" font-size="18" font-weight="700" fill="#55534E">Một mô hình phát hành, chấm trên ba tầng dữ liệu</text>
  <text x="500" y="100" text-anchor="middle" font-size="12" fill="#5A5A5A">cùng trọng số · ngưỡng ứng dụng chọn trên tập kiểm định rồi đóng băng · không huấn luyện hay chỉnh lại giữa các tầng</text>

  <!-- fan-out -->
  <line x1="500" y1="124" x2="500" y2="146" stroke="#9AA0A6" stroke-width="1.6"/>
  <line x1="186" y1="146" x2="812" y2="146" stroke="#9AA0A6" stroke-width="1.6"/>
  <line x1="186" y1="146" x2="186" y2="168" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="499" y1="146" x2="499" y2="168" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="812" y1="146" x2="812" y2="168" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ===== TIER 1 (blue) ===== -->
  <rect x="40" y="170" width="293" height="270" rx="14" fill="#E8F0FB" stroke="#C2D8F2"/>
  <circle cx="80" cy="206" r="17" fill="#2C63B0"/>
  <text x="80" y="212" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">1</text>
  <text x="106" y="212" font-size="16" font-weight="700" fill="#2C63B0">Trong miền</text>
  <rect x="56" y="234" width="261" height="96" rx="10" fill="#FFFFFF" stroke="#D2E1F6" filter="url(#cardShadow)"/>
  <text x="186" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#2C63B0">ISIC 2024 + PAD-UFES-20</text>
  <text x="186" y="286" text-anchor="middle" font-size="12" fill="#5A5A5A">tập kiểm tra · 59.093 ảnh · 399 bệnh nhân</text>
  <text x="186" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#5A5A5A">265 ác tính · 0,45%</text>
  <rect x="56" y="342" width="261" height="82" rx="10" fill="#DCE8F8"/>
  <text x="186" y="364" text-anchor="middle" font-size="11" font-weight="700" fill="#2C63B0">Trụ III-a — ảnh điện thoại PAD</text>
  <text x="186" y="383" text-anchor="middle" font-size="11" font-style="italic" fill="#2C63B0">397 ảnh (189 ác tính): độ nhạy và</text>
  <text x="186" y="400" text-anchor="middle" font-size="11" font-style="italic" fill="#2C63B0">độ đặc hiệu tại ngưỡng ứng dụng</text>

  <!-- ===== TIER 2 (purple) ===== -->
  <rect x="353" y="170" width="293" height="270" rx="14" fill="#ECEBFB" stroke="#C9C6F0"/>
  <circle cx="393" cy="206" r="17" fill="#4B41B8"/>
  <text x="393" y="212" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">2</text>
  <text x="419" y="212" font-size="16" font-weight="700" fill="#4B41B8">Miền mới — ảnh soi da</text>
  <rect x="369" y="234" width="261" height="96" rx="10" fill="#FFFFFF" stroke="#D6D3F5" filter="url(#cardShadow)"/>
  <text x="499" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#4B41B8">HAM10000</text>
  <text x="499" y="286" text-anchor="middle" font-size="12" fill="#5A5A5A">mỗi tổn thương một ảnh · 7.470 ảnh</text>
  <text x="499" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#5A5A5A">1.169 ác tính · 15,6%</text>
  <rect x="369" y="342" width="261" height="82" rx="10" fill="#E0DEF7"/>
  <text x="499" y="364" text-anchor="middle" font-size="11" font-weight="700" fill="#4B41B8">Chỉ báo cáo — không có cổng riêng</text>
  <text x="499" y="383" text-anchor="middle" font-size="11" font-style="italic" fill="#4B41B8">cùng PAD và Fitzpatrick17k góp một miền</text>
  <text x="499" y="400" text-anchor="middle" font-size="11" font-style="italic" fill="#4B41B8">vào điều kiện không kém teacher quá δ</text>

  <!-- ===== TIER 3 (olive) ===== -->
  <rect x="666" y="170" width="293" height="270" rx="14" fill="#EFF5E2" stroke="#D2E3B0"/>
  <circle cx="706" cy="206" r="17" fill="#55801F"/>
  <text x="706" y="212" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">3</text>
  <text x="732" y="212" font-size="16" font-weight="700" fill="#55801F">Tông da</text>
  <rect x="682" y="234" width="261" height="96" rx="10" fill="#FFFFFF" stroke="#DCEBC3" filter="url(#cardShadow)"/>
  <text x="812" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#55801F">Fitzpatrick17k</text>
  <text x="812" y="286" text-anchor="middle" font-size="12" fill="#5A5A5A">ảnh lâm sàng · 4.320 ảnh · 50,0% ác tính</text>
  <text x="812" y="312" text-anchor="middle" font-size="12" fill="#5A5A5A">sáng 2.310 · trung bình 1.599 · tối 411</text>
  <rect x="682" y="342" width="261" height="82" rx="10" fill="#E6EFD3"/>
  <text x="812" y="364" text-anchor="middle" font-size="11" font-weight="700" fill="#55801F">Trụ III-b — từng nhóm tông da</text>
  <text x="812" y="383" text-anchor="middle" font-size="11" font-style="italic" fill="#55801F">tại ngưỡng ứng dụng, chấm trên tập</text>
  <text x="812" y="400" text-anchor="middle" font-size="11" font-style="italic" fill="#55801F">con Fitzpatrick17k-C (3.086 ảnh)</text>

  <!-- ===== caveat bar (gray) ===== -->
  <rect x="40" y="456" width="920" height="32" rx="8" fill="#E2E0DB"/>
  <text x="500" y="477" text-anchor="middle" font-size="12" font-weight="600" fill="#55534E">Không đặt AUPRC của tầng này cạnh tầng khác: đường cơ sở ngẫu nhiên của AUPRC bằng tỉ lệ ác tính của từng tầng</text>

  <line x1="500" y1="488" x2="500" y2="514" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ===== ON DEVICE (green) ===== -->
  <rect x="40" y="516" width="920" height="148" rx="14" fill="#E7F4EC" stroke="#B6DEC5"/>
  <text x="500" y="550" text-anchor="middle" font-size="18" font-weight="700" fill="#1E7A45">Trên điện thoại Pixel 6a — trụ I và trụ II</text>
  <rect x="60" y="572" width="280" height="72" rx="10" fill="#FFFFFF" stroke="#CDE8D7" filter="url(#cardShadow)"/>
  <text x="200" y="598" text-anchor="middle" font-size="13" font-weight="700" fill="#1E7A45">Tương đương số học</text>
  <text x="200" y="618" text-anchor="middle" font-size="11" fill="#5A5A5A">logit điện thoại ↔ máy chủ</text>
  <text x="200" y="634" text-anchor="middle" font-size="11" fill="#5A5A5A">trên cùng tập ảnh · lỗi · tất định</text>
  <rect x="360" y="572" width="280" height="72" rx="10" fill="#FFFFFF" stroke="#CDE8D7" filter="url(#cardShadow)"/>
  <text x="500" y="598" text-anchor="middle" font-size="13" font-weight="700" fill="#1E7A45">Độ trễ phân vị 95</text>
  <text x="500" y="618" text-anchor="middle" font-size="11" fill="#5A5A5A">rút sạc · chế độ máy bay</text>
  <text x="500" y="634" text-anchor="middle" font-size="11" fill="#5A5A5A">sau 5 phút chạy liên tục</text>
  <rect x="660" y="572" width="280" height="72" rx="10" fill="#FFFFFF" stroke="#CDE8D7" filter="url(#cardShadow)"/>
  <text x="800" y="598" text-anchor="middle" font-size="13" font-weight="700" fill="#1E7A45">Pipeline camera của ứng dụng</text>
  <text x="800" y="618" text-anchor="middle" font-size="11" fill="#5A5A5A">tỉ lệ đổi quyết định tại ngưỡng</text>
  <text x="800" y="634" text-anchor="middle" font-size="11" fill="#5A5A5A">so với pipeline Python</text>
</svg>
