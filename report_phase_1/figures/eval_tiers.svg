<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="456" viewBox="0 0 1000 456"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AA0A6"/>
    </marker>
    <filter id="cardShadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1a1a1a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1000" height="456" fill="#FFFFFF"/>

  <!-- ===== ONE MODEL (gray) ===== -->
  <rect x="40" y="40" width="920" height="84" rx="14" fill="#EEEDEA" stroke="#D8D6D1"/>
  <text x="500" y="74" text-anchor="middle" font-size="18" font-weight="700" fill="#55534E">One trained model, scored three times</text>
  <text x="500" y="100" text-anchor="middle" font-size="12" fill="#5A5A5A">the same weights every time — nothing is retrained, nothing is re-tuned between tiers</text>

  <!-- fan-out -->
  <line x1="500" y1="124" x2="500" y2="146" stroke="#9AA0A6" stroke-width="1.6"/>
  <line x1="186" y1="146" x2="812" y2="146" stroke="#9AA0A6" stroke-width="1.6"/>
  <line x1="186" y1="146" x2="186" y2="168" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="499" y1="146" x2="499" y2="168" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="812" y1="146" x2="812" y2="168" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ===== TIER 1 (blue) ===== -->
  <rect x="40" y="170" width="293" height="246" rx="14" fill="#E8F0FB" stroke="#C2D8F2"/>
  <circle cx="80" cy="206" r="17" fill="#2C63B0"/>
  <text x="80" y="212" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">1</text>
  <text x="106" y="212" font-size="16" font-weight="700" fill="#2C63B0">In-domain</text>
  <rect x="56" y="234" width="261" height="96" rx="10" fill="#FFFFFF" stroke="#D2E1F6" filter="url(#cardShadow)"/>
  <text x="186" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#2C63B0">ISIC 2024 + PAD-UFES-20</text>
  <text x="186" y="286" text-anchor="middle" font-size="12" fill="#5A5A5A">held-out test split · 62,040 images</text>
  <text x="186" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#5A5A5A">0.39% malignant</text>
  <rect x="56" y="342" width="261" height="58" rx="10" fill="#DCE8F8"/>
  <text x="186" y="366" text-anchor="middle" font-size="11" font-style="italic" fill="#2C63B0">Does distillation help on the same</text>
  <text x="186" y="384" text-anchor="middle" font-size="11" font-style="italic" fill="#2C63B0">distribution the model trained on?</text>

  <!-- ===== TIER 2 (purple) ===== -->
  <rect x="353" y="170" width="293" height="246" rx="14" fill="#ECEBFB" stroke="#C9C6F0"/>
  <circle cx="393" cy="206" r="17" fill="#4B41B8"/>
  <text x="393" y="212" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">2</text>
  <text x="419" y="212" font-size="16" font-weight="700" fill="#4B41B8">New domain</text>
  <rect x="369" y="234" width="261" height="96" rx="10" fill="#FFFFFF" stroke="#D6D3F5" filter="url(#cardShadow)"/>
  <text x="499" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#4B41B8">HAM10000</text>
  <text x="499" y="286" text-anchor="middle" font-size="12" fill="#5A5A5A">one image per lesion · 7,470 images</text>
  <text x="499" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#5A5A5A">15.7% malignant</text>
  <rect x="369" y="342" width="261" height="58" rx="10" fill="#E0DEF7"/>
  <text x="499" y="366" text-anchor="middle" font-size="11" font-style="italic" fill="#4B41B8">Does that gain survive on data the</text>
  <text x="499" y="384" text-anchor="middle" font-size="11" font-style="italic" fill="#4B41B8">model has never seen?</text>

  <!-- ===== TIER 3 (olive) ===== -->
  <rect x="666" y="170" width="293" height="246" rx="14" fill="#EFF5E2" stroke="#D2E3B0"/>
  <circle cx="706" cy="206" r="17" fill="#55801F"/>
  <text x="706" y="212" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">3</text>
  <text x="732" y="212" font-size="16" font-weight="700" fill="#55801F">Skin tone</text>
  <rect x="682" y="234" width="261" height="96" rx="10" fill="#FFFFFF" stroke="#DCEBC3" filter="url(#cardShadow)"/>
  <text x="812" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#55801F">Fitzpatrick17k</text>
  <text x="812" y="286" text-anchor="middle" font-size="12" fill="#5A5A5A">clinical photographs · 4,320 images</text>
  <text x="812" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#5A5A5A">50.0% malignant</text>
  <rect x="682" y="342" width="261" height="58" rx="10" fill="#E6EFD3"/>
  <text x="812" y="366" text-anchor="middle" font-size="11" font-style="italic" fill="#55801F">Does it hold across light, medium</text>
  <text x="812" y="384" text-anchor="middle" font-size="11" font-style="italic" fill="#55801F">and dark skin?</text>

</svg>
