<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AA0A6"/>
    </marker>
    <filter id="cardShadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1a1a1a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="820" fill="#FFFFFF"/>

  <!-- Input -->
  <rect x="40" y="360" width="190" height="90" rx="12" fill="#EEEDEA" stroke="#D8D6D1" filter="url(#cardShadow)"/>
  <text x="135" y="396" text-anchor="middle" font-size="15" font-weight="700" fill="#55534E">Input image</text>
  <text x="135" y="418" text-anchor="middle" font-size="11" fill="#5A5A5A">skin lesion photo</text>

  <line x1="230" y1="390" x2="278" y2="255" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="230" y1="420" x2="278" y2="555" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Teacher lane -->
  <rect x="280" y="200" width="280" height="100" rx="12" fill="#FBEAE7" stroke="#F0C9C1" filter="url(#cardShadow)"/>
  <text x="420" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="#B23A2A">Teacher model</text>
  <text x="420" y="262" text-anchor="middle" font-size="11" fill="#5A5A5A">pretrained backbone (EfficientNet-B4)</text>
  <text x="420" y="282" text-anchor="middle" font-size="11" fill="#5A5A5A">frozen — no weight updates</text>

  <rect x="620" y="200" width="280" height="100" rx="12" fill="#FBEAE7" stroke="#F0C9C1" filter="url(#cardShadow)"/>
  <text x="760" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="#B23A2A">Soft labels</text>
  <text x="760" y="262" text-anchor="middle" font-size="11" fill="#5A5A5A">σ(teacher / T)</text>
  <text x="760" y="282" text-anchor="middle" font-size="11" fill="#5A5A5A">soft probability target</text>

  <line x1="560" y1="250" x2="618" y2="250" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Student lane -->
  <rect x="280" y="510" width="280" height="100" rx="12" fill="#ECEBFB" stroke="#C9C6F0" filter="url(#cardShadow)"/>
  <text x="420" y="548" text-anchor="middle" font-size="15" font-weight="700" fill="#4B41B8">Student model</text>
  <text x="420" y="572" text-anchor="middle" font-size="11" fill="#5A5A5A">lightweight · being trained</text>
  <text x="420" y="592" text-anchor="middle" font-size="11" fill="#5A5A5A">B0 / MobileNetV3-L / MobileViT-S</text>

  <rect x="620" y="510" width="280" height="100" rx="12" fill="#ECEBFB" stroke="#C9C6F0" filter="url(#cardShadow)"/>
  <text x="760" y="548" text-anchor="middle" font-size="15" font-weight="700" fill="#4B41B8">Student prediction</text>
  <text x="760" y="572" text-anchor="middle" font-size="11" fill="#5A5A5A">σ(student / T)</text>
  <text x="760" y="592" text-anchor="middle" font-size="11" fill="#5A5A5A">current output</text>

  <line x1="560" y1="560" x2="618" y2="560" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Ground truth -->
  <rect x="980" y="180" width="290" height="90" rx="12" fill="#E7F4EC" stroke="#B6DEC5" filter="url(#cardShadow)"/>
  <text x="1125" y="216" text-anchor="middle" font-size="15" font-weight="700" fill="#1E7A45">Ground truth</text>
  <text x="1125" y="238" text-anchor="middle" font-size="11" fill="#5A5A5A">hard label · 0=benign / 1=malignant</text>

  <!-- Combined loss -->
  <rect x="980" y="345" width="290" height="120" rx="12" fill="#EEEDEA" stroke="#D8D6D1" filter="url(#cardShadow)"/>
  <text x="1125" y="383" text-anchor="middle" font-size="15" font-weight="700" fill="#55534E">Combined KD loss</text>
  <text x="1125" y="407" text-anchor="middle" font-size="11" fill="#5A5A5A">0.3 · focal( student, hard label )</text>
  <text x="1125" y="427" text-anchor="middle" font-size="11" fill="#5A5A5A">+ 0.7 · T² · BCE( soft ),  T = 4</text>

  <line x1="900" y1="270" x2="978" y2="380" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="900" y1="540" x2="978" y2="430" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="1125" y1="270" x2="1125" y2="343" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Backprop -->
  <rect x="1330" y="330" width="230" height="72" rx="12" fill="#ECEBFB" stroke="#C9C6F0" filter="url(#cardShadow)"/>
  <text x="1445" y="362" text-anchor="middle" font-size="15" font-weight="700" fill="#4B41B8">Backpropagation</text>
  <text x="1445" y="384" text-anchor="middle" font-size="11" fill="#5A5A5A">student weights only</text>

  <line x1="1270" y1="400" x2="1328" y2="366" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Trained student -->
  <rect x="1330" y="442" width="230" height="72" rx="12" fill="#EFF5E2" stroke="#D2E3B0" filter="url(#cardShadow)"/>
  <text x="1445" y="474" text-anchor="middle" font-size="15" font-weight="700" fill="#55801F">Trained student</text>
  <text x="1445" y="496" text-anchor="middle" font-size="11" fill="#5A5A5A">lightweight · deployable</text>

  <line x1="1445" y1="402" x2="1445" y2="440" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>
