<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="596" viewBox="0 0 1000 596"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AA0A6"/>
    </marker>
    <filter id="cardShadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1a1a1a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1000" height="596" fill="#FFFFFF"/>

  <!-- ===== STEP 1 (green) ===== -->
  <rect x="40" y="40" width="920" height="136" rx="14" fill="#E7F4EC" stroke="#B6DEC5"/>
  <circle cx="92" cy="72" r="18" fill="#1E7A45"/>
  <text x="92" y="78" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">1</text>
  <text x="124" y="79" font-size="18" font-weight="700" fill="#1E7A45">Train the teacher</text>
  <rect x="60" y="102" width="880" height="56" rx="10" fill="#FFFFFF" stroke="#CDE8D7" filter="url(#cardShadow)"/>
  <text x="500" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#1E7A45">EfficientNetV2-M   ·   ConvNeXtV2-B   ·   MaxViT-B</text>
  <text x="500" y="146" text-anchor="middle" font-size="12" fill="#5A5A5A">focal loss, on the training fold</text>

  <line x1="500" y1="176" x2="500" y2="214" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="516" y="200" font-size="11" font-style="italic" fill="#8A8A8A">frozen from here on — it never learns again</text>

  <!-- ===== STEP 2 (purple) ===== -->
  <rect x="40" y="218" width="920" height="174" rx="14" fill="#ECEBFB" stroke="#C9C6F0"/>
  <circle cx="92" cy="250" r="18" fill="#4B41B8"/>
  <text x="92" y="256" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">2</text>
  <text x="124" y="257" font-size="18" font-weight="700" fill="#4B41B8">Train the student twice, on the same fold</text>

  <rect x="60" y="280" width="430" height="56" rx="10" fill="#FFFFFF" stroke="#D6D3F5" filter="url(#cardShadow)"/>
  <text x="275" y="304" text-anchor="middle" font-size="13" font-weight="700" fill="#4B41B8">With KD</text>
  <text x="275" y="324" text-anchor="middle" font-size="12" fill="#5A5A5A">true label  +  the teacher's soft target</text>

  <rect x="510" y="280" width="430" height="56" rx="10" fill="#FFFFFF" stroke="#D6D3F5" filter="url(#cardShadow)"/>
  <text x="725" y="304" text-anchor="middle" font-size="13" font-weight="700" fill="#4B41B8">Without KD</text>
  <text x="725" y="324" text-anchor="middle" font-size="12" fill="#5A5A5A">true label only — no teacher present</text>

  <rect x="60" y="346" width="880" height="28" rx="7" fill="#E0DEF7"/>
  <text x="500" y="365" text-anchor="middle" font-size="12" font-weight="600" fill="#4B41B8">same seed, same settings — only the loss differs</text>

  <line x1="500" y1="392" x2="500" y2="416" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ===== STEP 3 (olive) ===== -->
  <rect x="40" y="420" width="920" height="136" rx="14" fill="#EFF5E2" stroke="#D2E3B0"/>
  <circle cx="92" cy="452" r="18" fill="#55801F"/>
  <text x="92" y="458" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">3</text>
  <text x="124" y="459" font-size="18" font-weight="700" fill="#55801F">Compare the pair</text>
  <rect x="60" y="482" width="880" height="56" rx="10" fill="#FFFFFF" stroke="#DCEBC3" filter="url(#cardShadow)"/>
  <text x="500" y="506" text-anchor="middle" font-size="13" font-weight="700" fill="#55801F">Δ  =  with KD  −  without KD</text>
  <text x="500" y="526" text-anchor="middle" font-size="12" fill="#5A5A5A">matched fold by fold</text>
</svg>
