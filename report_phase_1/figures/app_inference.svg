<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="712" viewBox="0 0 1000 712" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AA0A6"/>
    </marker>
    <filter id="cardShadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1a1a1a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="712" fill="#FFFFFF"/>

  <!-- Camera / Gallery -->
  <rect x="350" y="30" width="300" height="64" rx="12" fill="#EEEDEA" stroke="#D8D6D1" filter="url(#cardShadow)"/>
  <text x="500" y="60" text-anchor="middle" font-size="15" font-weight="700" fill="#55534E">Camera / Gallery</text>
  <text x="500" y="80" text-anchor="middle" font-size="12" fill="#5A5A5A">user provides a skin-lesion image</text>

  <line x1="500" y1="94" x2="500" y2="150" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Quality gate -->
  <rect x="330" y="150" width="340" height="76" rx="12" fill="#E7F4EC" stroke="#B6DEC5" filter="url(#cardShadow)"/>
  <text x="500" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#1E7A45">Quality gate</text>
  <text x="500" y="202" text-anchor="middle" font-size="12" fill="#5A5A5A">blur check + brightness check</text>

  <!-- Reject -->
  <rect x="730" y="162" width="210" height="52" rx="12" fill="#FBEAE7" stroke="#F0C9C1" filter="url(#cardShadow)"/>
  <text x="835" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#B23A2A">Reject → retry</text>
  <text x="835" y="203" text-anchor="middle" font-size="11" fill="#5A5A5A">poor image quality</text>
  <line x1="670" y1="188" x2="730" y2="188" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <line x1="500" y1="226" x2="500" y2="278" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ExecuTorch inference -->
  <rect x="330" y="278" width="340" height="76" rx="12" fill="#ECEBFB" stroke="#C9C6F0" filter="url(#cardShadow)"/>
  <text x="500" y="308" text-anchor="middle" font-size="15" font-weight="700" fill="#4B41B8">ExecuTorch .pte inference</text>
  <text x="500" y="330" text-anchor="middle" font-size="12" fill="#5A5A5A">best KD student · FP32, fully on-device</text>

  <line x1="500" y1="354" x2="500" y2="406" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="330" y="406" width="340" height="72" rx="12" fill="#EEEDEA" stroke="#D8D6D1" filter="url(#cardShadow)"/>
  <text x="500" y="436" text-anchor="middle" font-size="15" font-weight="700" fill="#55534E">Output: P(malignant)</text>
  <text x="500" y="458" text-anchor="middle" font-size="12" fill="#5A5A5A">probability value 0.0 – 1.0</text>

  <line x1="500" y1="478" x2="500" y2="500" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- threshold bar -->
  <rect x="350" y="500" width="300" height="34" rx="8" fill="#E2E0DB"/>
  <text x="500" y="522" text-anchor="middle" font-size="12" font-weight="600" fill="#55534E">decision threshold via Youden's J</text>

  <line x1="500" y1="534" x2="290" y2="566" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="500" y1="534" x2="710" y2="566" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Low risk -->
  <rect x="110" y="566" width="330" height="118" rx="12" fill="#EFF5E2" stroke="#D2E3B0" filter="url(#cardShadow)"/>
  <text x="275" y="598" text-anchor="middle" font-size="15" font-weight="700" fill="#55801F">P &lt; threshold  →  Low risk</text>
  <rect x="130" y="612" width="290" height="56" rx="9" fill="#FFFFFF" stroke="#DCEBC3"/>
  <text x="275" y="636" text-anchor="middle" font-size="13" font-weight="700" fill="#55801F">Benign</text>
  <text x="275" y="656" text-anchor="middle" font-size="11" fill="#5A5A5A">self-monitor · recheck in ~3 months</text>

  <!-- High risk -->
  <rect x="560" y="566" width="330" height="118" rx="12" fill="#FBEAE7" stroke="#F0C9C1" filter="url(#cardShadow)"/>
  <text x="725" y="598" text-anchor="middle" font-size="15" font-weight="700" fill="#B23A2A">P ≥ threshold  →  High risk</text>
  <rect x="580" y="612" width="290" height="56" rx="9" fill="#FFFFFF" stroke="#F3D3CC"/>
  <text x="725" y="636" text-anchor="middle" font-size="13" font-weight="700" fill="#B23A2A">Malignant</text>
  <text x="725" y="656" text-anchor="middle" font-size="11" fill="#5A5A5A">see a dermatologist as soon as possible</text>
</svg>
