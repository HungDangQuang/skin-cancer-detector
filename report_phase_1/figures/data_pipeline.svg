<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1206" viewBox="0 0 1000 1206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AA0A6"/>
    </marker>
    <filter id="cardShadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1a1a1a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="1206" fill="#FFFFFF"/>

  <!-- ============ 3.1 Data sources (green) ============ -->
  <rect x="40" y="30" width="920" height="162" rx="14" fill="#E7F4EC" stroke="#B6DEC5"/>
  <text x="500" y="64" text-anchor="middle" font-size="18" font-weight="700" fill="#1E7A45">3.1  Data sources</text>
  <!-- card A -->
  <rect x="60" y="86" width="430" height="88" rx="10" fill="#FFFFFF" stroke="#CDE8D7" filter="url(#cardShadow)"/>
  <text x="275" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#1E7A45">ISIC 2024 SLICE-3D</text>
  <text x="275" y="132" text-anchor="middle" font-size="12" fill="#5A5A5A">401,059 images · non-dermoscopic (native ~128×128)</text>
  <text x="275" y="150" text-anchor="middle" font-size="12" fill="#5A5A5A">~0.9% malignant (~3,600 positives)</text>
  <text x="275" y="168" text-anchor="middle" font-size="12" font-weight="600" fill="#3B3B3B">Role: primary training</text>
  <!-- card B -->
  <rect x="510" y="86" width="430" height="88" rx="10" fill="#FFFFFF" stroke="#CDE8D7" filter="url(#cardShadow)"/>
  <text x="725" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#1E7A45">PAD-UFES-20</text>
  <text x="725" y="132" text-anchor="middle" font-size="12" fill="#5A5A5A">2,298 smartphone clinical images</text>
  <text x="725" y="150" text-anchor="middle" font-size="12" fill="#5A5A5A">6 classes → binary remap</text>
  <text x="725" y="168" text-anchor="middle" font-size="12" font-weight="600" fill="#3B3B3B">Role: extra malignant samples (optional)</text>

  <line x1="500" y1="192" x2="500" y2="220" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ============ 3.2 Cleaning & unification (gray) ============ -->
  <rect x="40" y="220" width="920" height="132" rx="14" fill="#EEEDEA" stroke="#D8D6D1"/>
  <text x="500" y="254" text-anchor="middle" font-size="18" font-weight="700" fill="#55534E">3.2  Data cleaning &amp; unification (offline)</text>
  <!-- 4 chips -->
  <rect x="60" y="276" width="208" height="58" rx="9" fill="#FFFFFF" stroke="#DCDAD5" filter="url(#cardShadow)"/>
  <text x="164" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#3B3B3B">Quality filter</text>
  <text x="164" y="320" text-anchor="middle" font-size="11" fill="#5A5A5A">corrupt · near-uniform · min-size</text>

  <rect x="284" y="276" width="208" height="58" rx="9" fill="#FFFFFF" stroke="#DCDAD5" filter="url(#cardShadow)"/>
  <text x="388" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#3B3B3B">Deduplicate</text>
  <text x="388" y="320" text-anchor="middle" font-size="11" fill="#5A5A5A">exact-pixel, per-dataset</text>

  <rect x="508" y="276" width="208" height="58" rx="9" fill="#FFFFFF" stroke="#DCDAD5" filter="url(#cardShadow)"/>
  <text x="612" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#3B3B3B">Label unification</text>
  <text x="612" y="320" text-anchor="middle" font-size="11" fill="#5A5A5A">6 / 7 classes → binary</text>

  <rect x="732" y="276" width="208" height="58" rx="9" fill="#FFFFFF" stroke="#DCDAD5" filter="url(#cardShadow)"/>
  <text x="836" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#3B3B3B">Resize + normalize</text>
  <text x="836" y="320" text-anchor="middle" font-size="11" fill="#5A5A5A">224² LANCZOS · ImageNet</text>

  <line x1="500" y1="352" x2="500" y2="380" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ============ 3.3 Splitting (purple) ============ -->
  <rect x="40" y="380" width="920" height="178" rx="14" fill="#ECEBFB" stroke="#C9C6F0"/>
  <text x="500" y="414" text-anchor="middle" font-size="18" font-weight="700" fill="#4B41B8">3.3  Data splitting strategy</text>
  <rect x="60" y="436" width="430" height="66" rx="10" fill="#FFFFFF" stroke="#D6D3F5" filter="url(#cardShadow)"/>
  <text x="275" y="460" text-anchor="middle" font-size="14" font-weight="700" fill="#4B41B8">Patient-level StratifiedGroupKFold</text>
  <text x="275" y="480" text-anchor="middle" font-size="12" fill="#5A5A5A">K=5 · stratified by label · grouped by patient_id</text>
  <text x="275" y="498" text-anchor="middle" font-size="12" fill="#5A5A5A">4 folds train / 1 fold val, rotated ×5</text>

  <rect x="510" y="436" width="430" height="66" rx="10" fill="#FFFFFF" stroke="#D6D3F5" filter="url(#cardShadow)"/>
  <text x="725" y="460" text-anchor="middle" font-size="14" font-weight="700" fill="#4B41B8">Independent held-out test set</text>
  <text x="725" y="480" text-anchor="middle" font-size="12" fill="#5A5A5A">patient-disjoint, carved BEFORE the CV (~17%)</text>
  <text x="725" y="498" text-anchor="middle" font-size="12" fill="#5A5A5A">no fold ever trains on it → unbiased test</text>

  <rect x="60" y="512" width="880" height="28" rx="8" fill="#E0DEF7"/>
  <text x="500" y="530" text-anchor="middle" font-size="12" font-weight="600" fill="#4B41B8">No patient leakage — the same patient always stays in one split</text>

  <line x1="500" y1="558" x2="500" y2="586" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ============ 3.4 Class imbalance (red) ============ -->
  <rect x="40" y="586" width="920" height="178" rx="14" fill="#FBEAE7" stroke="#F0C9C1"/>
  <text x="500" y="620" text-anchor="middle" font-size="18" font-weight="700" fill="#B23A2A">3.4  Class imbalance handling</text>
  <rect x="60" y="642" width="430" height="66" rx="10" fill="#FFFFFF" stroke="#F3D3CC" filter="url(#cardShadow)"/>
  <text x="275" y="666" text-anchor="middle" font-size="14" font-weight="700" fill="#B23A2A">Dynamic undersampling</text>
  <text x="275" y="686" text-anchor="middle" font-size="12" fill="#5A5A5A">1:5 malignant:benign, reshuffled per epoch</text>
  <text x="275" y="704" text-anchor="middle" font-size="12" fill="#5A5A5A">ratio = tunable hyperparameter (ablated)</text>

  <rect x="510" y="642" width="430" height="66" rx="10" fill="#FFFFFF" stroke="#F3D3CC" filter="url(#cardShadow)"/>
  <text x="725" y="666" text-anchor="middle" font-size="14" font-weight="700" fill="#B23A2A">Focal loss</text>
  <text x="725" y="686" text-anchor="middle" font-size="12" fill="#5A5A5A">γ = 2.0 · α = 0.25</text>
  <text x="725" y="704" text-anchor="middle" font-size="12" fill="#5A5A5A">α tuned jointly with the undersampling ratio</text>

  <rect x="60" y="718" width="880" height="28" rx="8" fill="#F6DBD5"/>
  <text x="500" y="736" text-anchor="middle" font-size="12" font-weight="600" fill="#9E3324">Class-symmetric — NO stronger augmentation on malignant (avoids train/test skew on positives)</text>

  <line x1="500" y1="764" x2="500" y2="792" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ============ 3.5 Augmentation (olive) ============ -->
  <rect x="40" y="792" width="920" height="178" rx="14" fill="#EFF5E2" stroke="#D2E3B0"/>
  <text x="500" y="826" text-anchor="middle" font-size="18" font-weight="700" fill="#55801F">3.5  Data augmentation pipeline (train only)</text>
  <rect x="60" y="848" width="208" height="66" rx="9" fill="#FFFFFF" stroke="#DCEBC3" filter="url(#cardShadow)"/>
  <text x="164" y="872" text-anchor="middle" font-size="13" font-weight="700" fill="#55801F">Geometric</text>
  <text x="164" y="892" text-anchor="middle" font-size="11" fill="#5A5A5A">flip · rotate 0–360°</text>
  <text x="164" y="907" text-anchor="middle" font-size="11" fill="#5A5A5A">scale ±20% · shift ±10%</text>

  <rect x="284" y="848" width="208" height="66" rx="9" fill="#FFFFFF" stroke="#DCEBC3" filter="url(#cardShadow)"/>
  <text x="388" y="872" text-anchor="middle" font-size="13" font-weight="700" fill="#55801F">Photometric</text>
  <text x="388" y="892" text-anchor="middle" font-size="11" fill="#5A5A5A">ColorJitter · CLAHE</text>
  <text x="388" y="907" text-anchor="middle" font-size="11" fill="#5A5A5A">GaussianBlur (low-p)</text>

  <rect x="508" y="848" width="208" height="66" rx="9" fill="#FFFFFF" stroke="#DCEBC3" filter="url(#cardShadow)"/>
  <text x="612" y="872" text-anchor="middle" font-size="13" font-weight="700" fill="#55801F">Config presets</text>
  <text x="612" y="892" text-anchor="middle" font-size="11" fill="#5A5A5A">light (default) / heavy</text>
  <text x="612" y="907" text-anchor="middle" font-size="11" fill="#5A5A5A">heavy = +GaussNoise</text>

  <rect x="732" y="848" width="208" height="66" rx="9" fill="#FFFFFF" stroke="#DCEBC3" filter="url(#cardShadow)"/>
  <text x="836" y="872" text-anchor="middle" font-size="13" font-weight="700" fill="#55801F">Stochastic depth</text>
  <text x="836" y="892" text-anchor="middle" font-size="11" fill="#5A5A5A">drop_path_rate</text>
  <text x="836" y="907" text-anchor="middle" font-size="11" fill="#5A5A5A">model-side, opt-in</text>

  <rect x="60" y="924" width="880" height="28" rx="8" fill="#E6EFD3"/>
  <text x="500" y="942" text-anchor="middle" font-size="12" font-weight="600" fill="#55801F">Class-symmetric, per-image · Excluded &amp; enforced in code: MixUp · CutMix · CutOut · microscope-crop vignette</text>

  <line x1="500" y1="970" x2="500" y2="998" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ============ 3.6 External validation (blue) ============ -->
  <rect x="40" y="998" width="920" height="178" rx="14" fill="#E8F0FB" stroke="#C2D8F2"/>
  <text x="500" y="1032" text-anchor="middle" font-size="18" font-weight="700" fill="#2C63B0">3.6  External validation datasets (test only)</text>
  <rect x="60" y="1054" width="430" height="66" rx="10" fill="#FFFFFF" stroke="#D2E1F6" filter="url(#cardShadow)"/>
  <text x="275" y="1078" text-anchor="middle" font-size="14" font-weight="700" fill="#2C63B0">HAM10000</text>
  <text x="275" y="1098" text-anchor="middle" font-size="12" fill="#5A5A5A">10,015 dermoscopic images</text>
  <text x="275" y="1116" text-anchor="middle" font-size="12" fill="#5A5A5A">cross-domain evaluation</text>

  <rect x="510" y="1054" width="430" height="66" rx="10" fill="#FFFFFF" stroke="#D2E1F6" filter="url(#cardShadow)"/>
  <text x="725" y="1078" text-anchor="middle" font-size="14" font-weight="700" fill="#2C63B0">Fitzpatrick17k</text>
  <text x="725" y="1098" text-anchor="middle" font-size="12" fill="#5A5A5A">16,577 clinical images · skin type I–VI</text>
  <text x="725" y="1116" text-anchor="middle" font-size="12" fill="#5A5A5A">fairness analysis</text>

  <rect x="60" y="1130" width="880" height="28" rx="8" fill="#DCE8F8"/>
  <text x="500" y="1148" text-anchor="middle" font-size="12" font-weight="600" fill="#2C63B0">Never used for training — inference only on the final models</text>
</svg>
