<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AA0A6"/>
    </marker>
    <filter id="cardShadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1a1a1a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1600" height="820" fill="#FFFFFF"/>

  <!-- ===== STEP 1 (green) ===== -->
  <rect x="70" y="220" width="460" height="380" rx="14" fill="#E7F4EC" stroke="#B6DEC5"/>
  <circle cx="130" cy="334" r="19" fill="#1E7A45"/>
  <text x="130" y="341" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">1</text>
  <text x="162" y="341" font-size="18" font-weight="700" fill="#1E7A45">Train the teacher</text>
  <rect x="90" y="370" width="420" height="130" rx="10" fill="#FFFFFF" stroke="#CDE8D7" filter="url(#cardShadow)"/>
  <text x="300" y="400" text-anchor="middle" font-size="13" font-weight="700" fill="#1E7A45">EfficientNetV2-M</text>
  <text x="300" y="424" text-anchor="middle" font-size="13" font-weight="700" fill="#1E7A45">ConvNeXtV2-B</text>
  <text x="300" y="448" text-anchor="middle" font-size="13" font-weight="700" fill="#1E7A45">MaxViT-B</text>
  <text x="300" y="478" text-anchor="middle" font-size="12" fill="#5A5A5A">focal loss, on the training fold</text>

  <line x1="530" y1="410" x2="566" y2="410" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="548" y="390" text-anchor="middle" font-size="11" font-style="italic" fill="#8A8A8A">frozen</text>

  <!-- ===== STEP 2 (purple) ===== -->
  <rect x="570" y="220" width="460" height="380" rx="14" fill="#ECEBFB" stroke="#C9C6F0"/>
  <circle cx="630" cy="266" r="19" fill="#4B41B8"/>
  <text x="630" y="273" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">2</text>
  <text x="662" y="267" font-size="18" font-weight="700" fill="#4B41B8">Train the student</text>
  <text x="662" y="289" font-size="18" font-weight="700" fill="#4B41B8">twice, on the same fold</text>
  <rect x="590" y="322" width="420" height="86" rx="10" fill="#FFFFFF" stroke="#D6D3F5" filter="url(#cardShadow)"/>
  <text x="800" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#4B41B8">With KD</text>
  <text x="800" y="376" text-anchor="middle" font-size="12" fill="#5A5A5A">true label + the teacher's soft target</text>
  <rect x="590" y="422" width="420" height="86" rx="10" fill="#FFFFFF" stroke="#D6D3F5" filter="url(#cardShadow)"/>
  <text x="800" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#4B41B8">Without KD</text>
  <text x="800" y="476" text-anchor="middle" font-size="12" fill="#5A5A5A">true label only — no teacher present</text>
  <rect x="590" y="522" width="420" height="30" rx="7" fill="#E0DEF7"/>
  <text x="800" y="542" text-anchor="middle" font-size="11" font-weight="600" fill="#4B41B8">same seed, same settings — only the loss differs</text>

  <line x1="1030" y1="410" x2="1066" y2="410" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ===== STEP 3 (olive) ===== -->
  <rect x="1070" y="220" width="460" height="380" rx="14" fill="#EFF5E2" stroke="#D2E3B0"/>
  <circle cx="1130" cy="334" r="19" fill="#55801F"/>
  <text x="1130" y="341" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">3</text>
  <text x="1162" y="341" font-size="18" font-weight="700" fill="#55801F">Compare the pair</text>
  <rect x="1090" y="370" width="420" height="130" rx="10" fill="#FFFFFF" stroke="#DCEBC3" filter="url(#cardShadow)"/>
  <text x="1300" y="416" text-anchor="middle" font-size="15" font-weight="700" fill="#55801F">Δ  =  with KD  −  without KD</text>
  <text x="1300" y="452" text-anchor="middle" font-size="12" fill="#5A5A5A">matched fold by fold</text>
</svg>
