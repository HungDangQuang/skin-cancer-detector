<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AA0A6"/>
    </marker>
    <filter id="cardShadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1a1a1a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="820" fill="#FFFFFF"/>

  <!-- Camera -->
  <rect x="40" y="365" width="200" height="90" rx="12" fill="#EEEDEA" stroke="#D8D6D1" filter="url(#cardShadow)"/>
  <text x="140" y="400" text-anchor="middle" font-size="15" font-weight="700" fill="#55534E">Camera / Gallery</text>
  <text x="140" y="422" text-anchor="middle" font-size="11" fill="#5A5A5A">user provides skin image</text>

  <line x1="240" y1="410" x2="298" y2="410" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Reject -->
  <rect x="300" y="210" width="230" height="70" rx="12" fill="#FBEAE7" stroke="#F0C9C1" filter="url(#cardShadow)"/>
  <text x="415" y="242" text-anchor="middle" font-size="14" font-weight="700" fill="#B23A2A">Reject → retry</text>
  <text x="415" y="262" text-anchor="middle" font-size="11" fill="#5A5A5A">poor image quality</text>

  <!-- Quality gate -->
  <rect x="300" y="365" width="230" height="90" rx="12" fill="#E7F4EC" stroke="#B6DEC5" filter="url(#cardShadow)"/>
  <text x="415" y="400" text-anchor="middle" font-size="15" font-weight="700" fill="#1E7A45">Quality gate</text>
  <text x="415" y="422" text-anchor="middle" font-size="11" fill="#5A5A5A">blur + brightness check</text>
  <line x1="415" y1="365" x2="415" y2="282" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <line x1="530" y1="410" x2="588" y2="410" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Inference -->
  <rect x="590" y="365" width="260" height="90" rx="12" fill="#ECEBFB" stroke="#C9C6F0" filter="url(#cardShadow)"/>
  <text x="720" y="400" text-anchor="middle" font-size="15" font-weight="700" fill="#4B41B8">ExecuTorch .pte inference</text>
  <text x="720" y="422" text-anchor="middle" font-size="11" fill="#5A5A5A">best KD student · FP32 on-device</text>

  <line x1="850" y1="410" x2="908" y2="410" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="910" y="365" width="230" height="90" rx="12" fill="#EEEDEA" stroke="#D8D6D1" filter="url(#cardShadow)"/>
  <text x="1025" y="400" text-anchor="middle" font-size="15" font-weight="700" fill="#55534E">Output: P(malignant)</text>
  <text x="1025" y="422" text-anchor="middle" font-size="11" fill="#5A5A5A">probability 0.0 – 1.0</text>

  <line x1="1140" y1="410" x2="1188" y2="410" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Threshold -->
  <rect x="1190" y="360" width="170" height="100" rx="12" fill="#E2E0DB" stroke="#D8D6D1" filter="url(#cardShadow)"/>
  <text x="1275" y="404" text-anchor="middle" font-size="14" font-weight="700" fill="#55534E">Decision threshold</text>
  <text x="1275" y="426" text-anchor="middle" font-size="11" fill="#5A5A5A">via Youden's J</text>

  <line x1="1360" y1="392" x2="1418" y2="300" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="1360" y1="428" x2="1418" y2="520" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Low risk -->
  <rect x="1380" y="215" width="195" height="120" rx="12" fill="#EFF5E2" stroke="#D2E3B0" filter="url(#cardShadow)"/>
  <text x="1477" y="247" text-anchor="middle" font-size="14" font-weight="700" fill="#55801F">P &lt; thr → Low risk</text>
  <rect x="1396" y="262" width="163" height="58" rx="9" fill="#FFFFFF" stroke="#DCEBC3"/>
  <text x="1477" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#55801F">Benign</text>
  <text x="1477" y="305" text-anchor="middle" font-size="10" fill="#5A5A5A">self-monitor · recheck ~3 mo</text>

  <!-- High risk -->
  <rect x="1380" y="460" width="195" height="120" rx="12" fill="#FBEAE7" stroke="#F0C9C1" filter="url(#cardShadow)"/>
  <text x="1477" y="492" text-anchor="middle" font-size="14" font-weight="700" fill="#B23A2A">P ≥ thr → High risk</text>
  <rect x="1396" y="507" width="163" height="58" rx="9" fill="#FFFFFF" stroke="#F3D3CC"/>
  <text x="1477" y="531" text-anchor="middle" font-size="12" font-weight="700" fill="#B23A2A">Malignant</text>
  <text x="1477" y="550" text-anchor="middle" font-size="10" fill="#5A5A5A">see a dermatologist soon</text>
</svg>
