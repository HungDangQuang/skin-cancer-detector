<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AA0A6"/>
    </marker>
    <filter id="cardShadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1a1a1a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="820" fill="#FFFFFF"/>

  <!-- Input -->
  <rect x="360" y="30" width="280" height="64" rx="12" fill="#EEEDEA" stroke="#D8D6D1" filter="url(#cardShadow)"/>
  <text x="500" y="60" text-anchor="middle" font-size="15" font-weight="700" fill="#55534E">Input image</text>
  <text x="500" y="80" text-anchor="middle" font-size="12" fill="#5A5A5A">skin lesion photo</text>

  <line x1="440" y1="92" x2="305" y2="150" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="560" y1="92" x2="695" y2="150" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Teacher / Student -->
  <rect x="110" y="150" width="330" height="88" rx="12" fill="#FBEAE7" stroke="#F0C9C1" filter="url(#cardShadow)"/>
  <text x="275" y="182" text-anchor="middle" font-size="15" font-weight="700" fill="#B23A2A">Teacher model</text>
  <text x="275" y="204" text-anchor="middle" font-size="12" fill="#5A5A5A">large pretrained backbone (EfficientNet-B4)</text>
  <text x="275" y="222" text-anchor="middle" font-size="12" fill="#5A5A5A">frozen — no weight updates</text>

  <rect x="560" y="150" width="330" height="88" rx="12" fill="#ECEBFB" stroke="#C9C6F0" filter="url(#cardShadow)"/>
  <text x="725" y="182" text-anchor="middle" font-size="15" font-weight="700" fill="#4B41B8">Student model</text>
  <text x="725" y="204" text-anchor="middle" font-size="12" fill="#5A5A5A">lightweight · being trained</text>
  <text x="725" y="222" text-anchor="middle" font-size="12" fill="#5A5A5A">EffNet-B0 / MobileNetV3-L / MobileViT-S</text>

  <line x1="275" y1="238" x2="275" y2="290" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="725" y1="238" x2="725" y2="290" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Soft labels / Student prediction -->
  <rect x="110" y="290" width="330" height="80" rx="12" fill="#FBEAE7" stroke="#F0C9C1" filter="url(#cardShadow)"/>
  <text x="275" y="320" text-anchor="middle" font-size="15" font-weight="700" fill="#B23A2A">Soft labels (teacher logits)</text>
  <text x="275" y="342" text-anchor="middle" font-size="12" fill="#5A5A5A">σ(teacher / T) — soft probability target</text>

  <rect x="560" y="290" width="330" height="80" rx="12" fill="#ECEBFB" stroke="#C9C6F0" filter="url(#cardShadow)"/>
  <text x="725" y="320" text-anchor="middle" font-size="15" font-weight="700" fill="#4B41B8">Student prediction</text>
  <text x="725" y="342" text-anchor="middle" font-size="12" fill="#5A5A5A">σ(student / T) — current output</text>

  <!-- Ground truth -->
  <rect x="350" y="410" width="300" height="76" rx="12" fill="#E7F4EC" stroke="#B6DEC5" filter="url(#cardShadow)"/>
  <text x="500" y="440" text-anchor="middle" font-size="15" font-weight="700" fill="#1E7A45">Ground truth</text>
  <text x="500" y="462" text-anchor="middle" font-size="12" fill="#5A5A5A">hard label · 0 = benign / 1 = malignant</text>

  <line x1="300" y1="370" x2="405" y2="520" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="700" y1="370" x2="595" y2="520" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="500" y1="486" x2="500" y2="520" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Combined loss -->
  <rect x="230" y="520" width="540" height="90" rx="12" fill="#EEEDEA" stroke="#D8D6D1" filter="url(#cardShadow)"/>
  <text x="500" y="552" text-anchor="middle" font-size="15" font-weight="700" fill="#55534E">Combined KD loss</text>
  <text x="500" y="574" text-anchor="middle" font-size="12" fill="#5A5A5A">0.3 · focal( student, hard label )</text>
  <text x="500" y="592" text-anchor="middle" font-size="12" fill="#5A5A5A">+ 0.7 · T² · BCE( soft: teacher vs student ),  T = 4</text>

  <line x1="500" y1="610" x2="500" y2="644" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Backprop -->
  <rect x="310" y="644" width="380" height="64" rx="12" fill="#ECEBFB" stroke="#C9C6F0" filter="url(#cardShadow)"/>
  <text x="500" y="672" text-anchor="middle" font-size="15" font-weight="700" fill="#4B41B8">Backpropagation</text>
  <text x="500" y="692" text-anchor="middle" font-size="12" fill="#5A5A5A">updates student weights only</text>

  <line x1="500" y1="708" x2="500" y2="742" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Trained student -->
  <rect x="310" y="742" width="380" height="60" rx="12" fill="#EFF5E2" stroke="#D2E3B0" filter="url(#cardShadow)"/>
  <text x="500" y="778" text-anchor="middle" font-size="15" font-weight="700" fill="#55801F">Trained lightweight student</text>
</svg>
