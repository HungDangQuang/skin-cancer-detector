<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1282" viewBox="0 0 1000 1282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AA0A6"/>
    </marker>
    <filter id="cardShadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1a1a1a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="1282" fill="#FFFFFF"/>

  <!-- ============ 1. The risk (red) ============ -->
  <rect x="40" y="30" width="920" height="200" rx="14" fill="#FBEAE7" stroke="#F0C9C1"/>
  <text x="500" y="64" text-anchor="middle" font-size="18" font-weight="700" fill="#B23A2A">The risk — one patient owns many images</text>
  <rect x="60" y="86" width="430" height="88" rx="10" fill="#FFFFFF" stroke="#F3D3CC" filter="url(#cardShadow)"/>
  <text x="275" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#B23A2A">ISIC 2024 — 3D total-body photography</text>
  <text x="275" y="132" text-anchor="middle" font-size="12" fill="#5A5A5A">One patient contributes tens to hundreds of lesion crops</text>
  <text x="275" y="150" text-anchor="middle" font-size="12" fill="#5A5A5A">Different lesions, but one body and one session</text>
  <text x="275" y="168" text-anchor="middle" font-size="12" font-weight="600" fill="#3B3B3B">Shared skin tone · hair · lighting · device</text>
  <rect x="510" y="86" width="430" height="88" rx="10" fill="#FFFFFF" stroke="#F3D3CC" filter="url(#cardShadow)"/>
  <text x="725" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#B23A2A">PAD-UFES-20 — smartphone clinical photos</text>
  <text x="725" y="132" text-anchor="middle" font-size="12" fill="#5A5A5A">Several photographs of the very same lesion</text>
  <text x="725" y="150" text-anchor="middle" font-size="12" fill="#5A5A5A">Differing only in camera angle and distance</text>
  <text x="725" y="168" text-anchor="middle" font-size="12" font-weight="600" fill="#3B3B3B">Literal near-duplicates</text>
  <rect x="60" y="184" width="880" height="28" rx="8" fill="#F6DBD5"/>
  <text x="500" y="203" text-anchor="middle" font-size="12" font-weight="600" fill="#9E3324">A random per-image split puts near-copies on both sides — the model then recognises the PATIENT, not the disease</text>

  <line x1="500" y1="230" x2="500" y2="258" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ============ 2. Step 1 — carve test (purple) ============ -->
  <rect x="40" y="258" width="920" height="200" rx="14" fill="#ECEBFB" stroke="#C9C6F0"/>
  <text x="500" y="292" text-anchor="middle" font-size="18" font-weight="700" fill="#4B41B8">Step 1 — carve the held-out test set FIRST</text>
  <rect x="60" y="314" width="430" height="88" rx="10" fill="#FFFFFF" stroke="#D6D3F5" filter="url(#cardShadow)"/>
  <text x="275" y="338" text-anchor="middle" font-size="14" font-weight="700" fill="#4B41B8">Held-out test = 1 / 6 of the data (≈ 17%)</text>
  <text x="275" y="360" text-anchor="middle" font-size="12" fill="#5A5A5A">62,040 images · 241 malignant · prevalence 0.3885%</text>
  <text x="275" y="378" text-anchor="middle" font-size="12" fill="#5A5A5A">Written once to splits/test_split.csv</text>
  <text x="275" y="396" text-anchor="middle" font-size="12" font-weight="600" fill="#3B3B3B">Left untouched until the final scoring</text>
  <rect x="510" y="314" width="430" height="88" rx="10" fill="#FFFFFF" stroke="#D6D3F5" filter="url(#cardShadow)"/>
  <text x="725" y="338" text-anchor="middle" font-size="14" font-weight="700" fill="#4B41B8">Two constraints, satisfied together</text>
  <text x="725" y="360" text-anchor="middle" font-size="12" fill="#5A5A5A">Patient-disjoint — no patient appears on both sides</text>
  <text x="725" y="378" text-anchor="middle" font-size="12" fill="#5A5A5A">Label-stratified — test prevalence = overall prevalence</text>
  <text x="725" y="396" text-anchor="middle" font-size="12" font-weight="600" fill="#3B3B3B">Otherwise the test set describes a population that does not exist</text>
  <rect x="60" y="412" width="880" height="28" rx="8" fill="#E0DEF7"/>
  <text x="500" y="431" text-anchor="middle" font-size="12" font-weight="600" fill="#4B41B8">StratifiedGroupKFold(n_splits=6, shuffle=True, random_state=42) — split 0 becomes the test set, the rest is the dev pool</text>

  <line x1="500" y1="458" x2="500" y2="486" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ============ 3. Step 2 — 5-fold CV (blue) ============ -->
  <rect x="40" y="486" width="920" height="200" rx="14" fill="#E8F0FB" stroke="#C2D8F2"/>
  <text x="500" y="520" text-anchor="middle" font-size="18" font-weight="700" fill="#2C63B0">Step 2 — 5-fold CV on the remaining dev pool</text>
  <rect x="60" y="542" width="430" height="88" rx="10" fill="#FFFFFF" stroke="#D2E1F6" filter="url(#cardShadow)"/>
  <text x="275" y="566" text-anchor="middle" font-size="14" font-weight="700" fill="#2C63B0">StratifiedGroupKFold(K=5, random_state=42)</text>
  <text x="275" y="588" text-anchor="middle" font-size="12" fill="#5A5A5A">Group = patient_id → a patient is never split in two</text>
  <text x="275" y="606" text-anchor="middle" font-size="12" fill="#5A5A5A">Stratify = malignant : benign ratio kept in every part</text>
  <text x="275" y="624" text-anchor="middle" font-size="12" font-weight="600" fill="#3B3B3B">→ fold_{0..4} / {train, val}_split.csv</text>
  <rect x="510" y="542" width="430" height="88" rx="10" fill="#FFFFFF" stroke="#D2E1F6" filter="url(#cardShadow)"/>
  <text x="725" y="566" text-anchor="middle" font-size="14" font-weight="700" fill="#2C63B0">Five independent models, one configuration</text>
  <text x="725" y="588" text-anchor="middle" font-size="12" fill="#5A5A5A">248,161 training images available in each fold</text>
  <text x="725" y="606" text-anchor="middle" font-size="12" fill="#5A5A5A">Test patients were removed from the pool beforehand</text>
  <text x="725" y="624" text-anchor="middle" font-size="12" font-weight="600" fill="#3B3B3B">No fold ever sees a test patient</text>
  <rect x="60" y="640" width="880" height="28" rx="8" fill="#DCE8F8"/>
  <text x="500" y="659" text-anchor="middle" font-size="12" font-weight="600" fill="#2C63B0">All five folds are scored on the SAME sealed test set — which is what makes the paired KD vs baseline comparison valid</text>

  <line x1="500" y1="686" x2="500" y2="714" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ============ 4. Resulting scale (olive) ============ -->
  <rect x="40" y="714" width="920" height="146" rx="14" fill="#EFF5E2" stroke="#D2E3B0"/>
  <text x="500" y="748" text-anchor="middle" font-size="18" font-weight="700" fill="#55801F">Resulting scale — three very different numbers</text>
  <rect x="60" y="770" width="280" height="72" rx="10" fill="#FFFFFF" stroke="#DCEBC3" filter="url(#cardShadow)"/>
  <text x="200" y="794" text-anchor="middle" font-size="14" font-weight="700" fill="#55801F">Held-out test set</text>
  <text x="200" y="816" text-anchor="middle" font-size="12" fill="#5A5A5A">62,040 images</text>
  <text x="200" y="834" text-anchor="middle" font-size="12" fill="#5A5A5A">241 malignant · 0.3885%</text>
  <rect x="360" y="770" width="280" height="72" rx="10" fill="#FFFFFF" stroke="#DCEBC3" filter="url(#cardShadow)"/>
  <text x="500" y="794" text-anchor="middle" font-size="14" font-weight="700" fill="#55801F">Train pool per fold</text>
  <text x="500" y="816" text-anchor="middle" font-size="12" fill="#5A5A5A">248,161 images</text>
  <text x="500" y="834" text-anchor="middle" font-size="12" fill="#5A5A5A">before any sampling</text>
  <rect x="660" y="770" width="280" height="72" rx="10" fill="#FFFFFF" stroke="#DCEBC3" filter="url(#cardShadow)"/>
  <text x="800" y="794" text-anchor="middle" font-size="14" font-weight="700" fill="#55801F">Actually seen per epoch</text>
  <text x="800" y="816" text-anchor="middle" font-size="12" fill="#5A5A5A">5,790 images</text>
  <text x="800" y="834" text-anchor="middle" font-size="12" fill="#5A5A5A">1:5 ratio · redrawn every epoch</text>

  <line x1="500" y1="860" x2="500" y2="888" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ============ 5. Four barriers (green) ============ -->
  <rect x="40" y="888" width="920" height="174" rx="14" fill="#E7F4EC" stroke="#B6DEC5"/>
  <text x="500" y="922" text-anchor="middle" font-size="18" font-weight="700" fill="#1E7A45">Four leakage barriers, placed where leakage can enter</text>
  <rect x="60" y="944" width="208" height="62" rx="9" fill="#FFFFFF" stroke="#CDE8D7" filter="url(#cardShadow)"/>
  <text x="164" y="968" text-anchor="middle" font-size="13" font-weight="700" fill="#1E7A45">1 · Before folding</text>
  <text x="164" y="988" text-anchor="middle" font-size="11" fill="#5A5A5A">test carved patient-disjoint</text>
  <rect x="284" y="944" width="208" height="62" rx="9" fill="#FFFFFF" stroke="#CDE8D7" filter="url(#cardShadow)"/>
  <text x="388" y="968" text-anchor="middle" font-size="13" font-weight="700" fill="#1E7A45">2 · While folding</text>
  <text x="388" y="988" text-anchor="middle" font-size="11" fill="#5A5A5A">group key = patient_id</text>
  <rect x="508" y="944" width="208" height="62" rx="9" fill="#FFFFFF" stroke="#CDE8D7" filter="url(#cardShadow)"/>
  <text x="612" y="968" text-anchor="middle" font-size="13" font-weight="700" fill="#1E7A45">3 · At dataset merge</text>
  <text x="612" y="988" text-anchor="middle" font-size="11" fill="#5A5A5A">PAD ids prefixed pad_</text>
  <rect x="732" y="944" width="208" height="62" rx="9" fill="#FFFFFF" stroke="#CDE8D7" filter="url(#cardShadow)"/>
  <text x="836" y="968" text-anchor="middle" font-size="13" font-weight="700" fill="#1E7A45">4 · External test prep</text>
  <text x="836" y="988" text-anchor="middle" font-size="11" fill="#5A5A5A">overlap check → exit code 2</text>
  <rect x="60" y="1016" width="880" height="28" rx="8" fill="#DCEBD9"/>
  <text x="500" y="1035" text-anchor="middle" font-size="12" font-weight="600" fill="#1E7A45">Enforced by the code path, not by discipline — barrier 4 aborts the run instead of printing a warning</text>

  <line x1="500" y1="1062" x2="500" y2="1090" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ============ 6. Rejected design + cost (gray) ============ -->
  <rect x="40" y="1090" width="920" height="162" rx="14" fill="#EEEDEA" stroke="#D8D6D1"/>
  <text x="500" y="1124" text-anchor="middle" font-size="18" font-weight="700" fill="#55534E">The rejected design, and what the correct one costs</text>
  <rect x="60" y="1146" width="430" height="88" rx="10" fill="#FFFFFF" stroke="#DCDAD5" filter="url(#cardShadow)"/>
  <text x="275" y="1170" text-anchor="middle" font-size="14" font-weight="700" fill="#3B3B3B">Earlier design — found and fixed</text>
  <text x="275" y="1192" text-anchor="middle" font-size="12" fill="#5A5A5A">test set was fold 0's validation split</text>
  <text x="275" y="1210" text-anchor="middle" font-size="12" fill="#5A5A5A">→ folds 1–4 trained on their own test data</text>
  <text x="275" y="1228" text-anchor="middle" font-size="12" font-weight="600" fill="#3B3B3B">Silent: no error, only inflated scores</text>
  <rect x="510" y="1146" width="430" height="88" rx="10" fill="#FFFFFF" stroke="#DCDAD5" filter="url(#cardShadow)"/>
  <text x="725" y="1170" text-anchor="middle" font-size="14" font-weight="700" fill="#3B3B3B">Price of the patient-level split</text>
  <text x="725" y="1192" text-anchor="middle" font-size="12" fill="#5A5A5A">Every score is lower than a random split would give</text>
  <text x="725" y="1210" text-anchor="middle" font-size="12" fill="#5A5A5A">That gap = memorisation reported as diagnosis</text>
  <text x="725" y="1228" text-anchor="middle" font-size="12" font-weight="600" fill="#3B3B3B">Lower, but honest</text>
</svg>
