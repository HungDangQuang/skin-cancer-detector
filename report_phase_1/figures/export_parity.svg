<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AA0A6"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B23A2A"/>
    </marker>
    <filter id="cardShadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1a1a1a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1000" height="620" fill="#FFFFFF"/>

  <!-- ===== 1. PICK (green) ===== -->
  <rect x="50" y="40" width="640" height="104" rx="14" fill="#E7F4EC" stroke="#B6DEC5"/>
  <text x="370" y="74" text-anchor="middle" font-size="17" font-weight="700" fill="#1E7A45">Pick one fold per model</text>
  <rect x="70" y="88" width="600" height="40" rx="10" fill="#FFFFFF" stroke="#CDE8D7" filter="url(#cardShadow)"/>
  <text x="370" y="113" text-anchor="middle" font-size="12" fill="#5A5A5A">the <tspan font-weight="700" fill="#1E7A45">median</tspan> fold, never the best — picking the best is selection on the test set</text>

  <line x1="370" y1="144" x2="370" y2="168" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ===== 2. EXPORT (blue) ===== -->
  <rect x="50" y="172" width="640" height="104" rx="14" fill="#E8F0FB" stroke="#C2D8F2"/>
  <text x="370" y="206" text-anchor="middle" font-size="17" font-weight="700" fill="#2C63B0">Export to the mobile runtime</text>
  <rect x="70" y="220" width="600" height="40" rx="10" fill="#FFFFFF" stroke="#D2E1F6" filter="url(#cardShadow)"/>
  <text x="370" y="245" text-anchor="middle" font-size="12" fill="#5A5A5A">FP32, no quantisation — first try the <tspan font-weight="700" fill="#2C63B0">accelerated</tspan> operator library</text>

  <line x1="370" y1="276" x2="370" y2="300" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ===== 3. PARITY GATE (red hexagon) ===== -->
  <path d="M140,304 L600,304 L650,352 L600,400 L140,400 L90,352 Z" fill="#FBEAE7" stroke="#F0C9C1" stroke-width="1.6"/>
  <text x="370" y="342" text-anchor="middle" font-size="17" font-weight="700" fill="#B23A2A">Parity gate</text>
  <text x="370" y="368" text-anchor="middle" font-size="12" fill="#5A5A5A">is the exported model still the same model?</text>

  <!-- fail -> fallback lane -->
  <line x1="650" y1="352" x2="716" y2="352" stroke="#B23A2A" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>
  <text x="683" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#B23A2A">fail</text>

  <!-- ===== FALLBACK (red, right lane) ===== -->
  <rect x="720" y="300" width="230" height="104" rx="14" fill="#FBEAE7" stroke="#F0C9C1"/>
  <text x="835" y="330" text-anchor="middle" font-size="15" font-weight="700" fill="#B23A2A">Fall back</text>
  <text x="835" y="354" text-anchor="middle" font-size="12" fill="#5A5A5A">reference operators —</text>
  <text x="835" y="372" text-anchor="middle" font-size="12" fill="#5A5A5A">correct but far slower,</text>
  <text x="835" y="390" text-anchor="middle" font-size="12" fill="#5A5A5A">then test the gate again</text>

  <!-- fallback loops back into EXPORT -->
  <path d="M835,300 L835,224 L694,224" fill="none" stroke="#B23A2A" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>

  <!-- pass -> measure -->
  <line x1="370" y1="400" x2="370" y2="466" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="386" y="437" font-size="12" font-weight="700" fill="#1E7A45">pass</text>

  <!-- ===== 4. MEASURE (olive) ===== -->
  <rect x="50" y="470" width="640" height="104" rx="14" fill="#EFF5E2" stroke="#D2E3B0"/>
  <text x="370" y="504" text-anchor="middle" font-size="17" font-weight="700" fill="#55801F">Measure on the phone</text>
  <rect x="70" y="518" width="600" height="40" rx="10" fill="#FFFFFF" stroke="#DCEBC3" filter="url(#cardShadow)"/>
  <text x="370" y="537" text-anchor="middle" font-size="12" fill="#5A5A5A">cold start  ·  best-case latency  ·  peak memory</text>
  <text x="370" y="552" text-anchor="middle" font-size="12" font-weight="700" fill="#55801F">sustained latency after 5 minutes — the number the app really shows</text>
</svg>
